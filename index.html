<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Motherboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Light Mode */
            --bg-color: #F8F5F0;
            --surface-card: #FFFFFF;
            --surface-subtle: #F2EFE9;
            --primary: #945D4C;
            --primary-soft: #F5ECE8;
            --text-main: #2D2725;
            --text-muted: #827874;
            --card-shadow: 0 4px 16px -2px rgba(45, 39, 37, 0.05), 0 2px 4px -1px rgba(45, 39, 37, 0.03);
            --card-border: 1px solid rgba(45, 39, 37, 0.06);
            --radius-outer: 18px;
            --radius-inner: 12px;

            /* Notepad Palette (Light) */
            --note-default: #FFFFFF;
            --note-yellow: #FFF9D2;
            --note-green: #E4F9DE;
            --note-pink: #FFE5EE;
            --note-blue: #E1F0FF;
            --note-purple: #EFE3FF;

            /* Wishlist Palette (Light) */
            --sticky-yellow: #FFF7B2;
            --sticky-green: #D7F9D0;
            --sticky-pink: #FFD4E5;
            --sticky-blue: #D0E9FF;
            --sticky-purple: #E8D9FF;
            --sticky-text: #2B2625;

            /* Tier List Colors */
            --tier-s: #B4F47B;
            --tier-a: #FFF176;
            --tier-b: #FFD57E;
            --tier-c: #FFB380;
            --tier-d: #FF8A8A;
        }

        /* Dark Mode */
        [data-theme="dark"] {
            --bg-color: #161514;
            --surface-card: #201E1D;
            --surface-subtle: #2B2826;
            --primary: #D49785;
            --primary-soft: #382823;
            --text-main: #F4EFEB;
            --text-muted: #9E938E;
            --card-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.3);
            --card-border: 1px solid rgba(255, 255, 255, 0.06);

            /* Notepad Palette (Dark) */
            --note-default: #201E1D;
            --note-yellow: #38341E;
            --note-green: #1F3323;
            --note-pink: #361F2B;
            --note-blue: #1D2D3E;
            --note-purple: #2D213F;

            /* Wishlist Palette (Dark) */
            --sticky-yellow: #3D3A20;
            --sticky-green: #233827;
            --sticky-pink: #3D222F;
            --sticky-blue: #1D3145;
            --sticky-purple: #322547;
            --sticky-text: #F3EFE9;

            /* Tier List Colors (Dark) */
            --tier-s: #3B5A24;
            --tier-a: #5E531B;
            --tier-b: #5C451D;
            --tier-c: #5E3921;
            --tier-d: #5C2727;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            position: relative;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 16px 14px 36px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2px;
            width: 100%;
        }

        .app-title {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: var(--text-main);
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .theme-toggle-btn {
            background: var(--surface-subtle);
            border: var(--card-border);
            border-radius: 999px;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            outline: none;
            padding: 0;
            position: relative;
            flex-shrink: 0;
        }

        .theme-toggle-btn:active {
            transform: scale(0.92);
        }

        .theme-icon {
            width: 16px;
            height: 16px;
        }

        .profile-switcher {
            background: var(--surface-subtle);
            border: var(--card-border);
            border-radius: 999px;
            padding: 3px;
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }

        .switch-btn {
            background: transparent;
            border: none;
            outline: none;
            padding: 5px 14px;
            border-radius: 999px;
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .switch-btn.active {
            background: var(--surface-card);
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        /* Ticker Banner */
        .neon-ticker-banner {
            position: relative;
            background: #101018;
            border: 1px solid #00F5D4;
            box-shadow: 0 0 14px rgba(0, 245, 212, 0.4), inset 0 0 10px rgba(255, 0, 127, 0.2);
            border-radius: 12px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            overflow: hidden;
            gap: 10px;
        }

        .neon-tag {
            background: #FF007F;
            color: #FFFFFF;
            font-size: 9.5px;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 6px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            box-shadow: 0 0 8px #FF007F;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .marquee-track {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }

        .marquee-content {
            display: inline-block;
            white-space: nowrap;
            animation: marqueeScroll 18s linear infinite;
            font-size: 11px;
            font-weight: 700;
            color: #00F5D4;
            text-shadow: 0 0 6px rgba(0, 245, 212, 0.6);
        }

        @keyframes marqueeScroll {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .neon-banner-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .neon-banner-btn {
            background: rgba(0, 245, 212, 0.15);
            border: 1px solid #00F5D4;
            color: #FFFFFF;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10.5px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0, 245, 212, 0.4);
        }

        .neon-close-btn {
            background: transparent;
            border: none;
            color: #FF007F;
            font-size: 12px;
            cursor: pointer;
            padding: 0 2px;
            font-weight: 800;
        }

        .view-content {
            display: none;
        }

        .view-content.active-view {
            display: block;
        }

        /* Bento Grid */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .compact-card {
            background: var(--surface-card);
            border-radius: var(--radius-outer);
            border: var(--card-border);
            box-shadow: var(--card-shadow);
            padding: 14px 14px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 110px;
            position: relative;
            user-select: none;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .compact-card:active {
            transform: scale(0.97);
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .icon-badge {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-inner);
            background: var(--primary-soft);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            line-height: 1;
        }

        .card-arrow {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--surface-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            opacity: 0.6;
        }

        .card-bottom {
            margin-top: 12px;
        }

        .card-heading {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.2px;
            line-height: 1.25;
        }

        .card-subtitle {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            margin-top: 3px;
        }

        /* Split Tile */
        .split-card-wrapper {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .micro-card {
            background: var(--surface-card);
            border-radius: var(--radius-outer);
            border: var(--card-border);
            box-shadow: var(--card-shadow);
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            min-height: 110px;
        }

        .micro-card:active {
            transform: scale(0.94);
        }

        .micro-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-inner);
            background: var(--primary-soft);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .micro-heading {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.2px;
            line-height: 1.2;
        }

        .micro-subtitle {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Feature Card Accordions */
        .features-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .dropdown-feature-card {
            background: var(--surface-card);
            border-radius: var(--radius-outer);
            border: var(--card-border);
            box-shadow: var(--card-shadow);
            overflow: hidden;
            transition: background-color 0.25s ease, box-shadow 0.2s ease;
        }

        .dropdown-feature-header {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .feature-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .feature-icon-badge {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-inner);
            background: var(--primary-soft);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            line-height: 1;
        }

        .feature-titles-group {
            display: flex;
            flex-direction: column;
        }

        .feature-main-title {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.2px;
        }

        .feature-sub-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .feature-chevron {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--surface-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 10px;
            transition: transform 0.25s ease;
        }

        .dropdown-feature-card.open .feature-chevron {
            transform: rotate(180deg);
        }

        .dropdown-feature-body {
            display: none;
            padding: 0 16px 16px;
            flex-direction: column;
            gap: 12px;
            border-top: var(--card-border);
        }

        .dropdown-feature-card.open .dropdown-feature-body {
            display: flex;
        }

        /* ----------------------------------------------------
           KITCHEN DECK (RECIPES & COOK MODE)
           ---------------------------------------------------- */
        .recipe-cards-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .recipe-item-card {
            background: var(--surface-subtle);
            border: var(--card-border);
            border-radius: var(--radius-inner);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .recipe-item-header {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .recipe-title-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .recipe-name {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-main);
        }

        .recipe-tag-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .recipe-tag-pill {
            font-size: 9.5px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 6px;
            background: var(--surface-card);
            color: var(--
